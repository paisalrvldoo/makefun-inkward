<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INKWARD — Guard the last bell</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6dcc4; }
  #game { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; outline: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" tabindex="0" aria-label="INKWARD. Hold left mouse to paint walls. Draw a closed loop around spirits to seal them. WASD move, Space dash, right mouse splash, Q and E brush arts, P pause, M mute."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
